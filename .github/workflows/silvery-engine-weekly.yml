# Silvery Engine — Weekly Scheduled Run
#
# Triggers the Silvery Engine computation every 7 days by calling the
# Supabase Edge Function endpoint (if deployed) or logging a reminder.
#
# To enable the automated backend run:
#  1. Deploy the `silvery-engine-run` Supabase Edge Function (see
#     supabase/functions/silvery-engine-run/index.ts — TODO)
#  2. Add the following repository secrets:
#       SUPABASE_URL          — your project URL
#       SUPABASE_SERVICE_ROLE_KEY — service role key (bypasses RLS)
#       SILVERY_ENGINE_USER_ID    — user UUID to run the engine for
#         (or implement multi-tenant logic in the edge function)
#
# Current behaviour (no secrets configured): the job logs a reminder and
# exits successfully so CI is never broken.

name: Silvery Engine Weekly Run

on:
  schedule:
    # Every Monday at 03:00 UTC (every 7 days)
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, no API call)"
        required: false
        default: "false"

jobs:
  run-silvery-engine:
    name: Run Silvery Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check configuration
        id: check_config
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY not configured. Skipping engine call."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Silvery Engine via Supabase Edge Function
        if: steps.check_config.outputs.configured == 'true' && github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_ID: ${{ secrets.SILVERY_ENGINE_USER_ID }}
        run: |
          echo "Calling Silvery Engine edge function..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"trigger\":\"scheduled\",\"user_id\":\"${USER_ID}\"}" \
            "${SUPABASE_URL}/functions/v1/silvery-engine-run")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "Response (${HTTP_CODE}): ${HTTP_BODY}"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Engine call failed with HTTP ${HTTP_CODE}: ${HTTP_BODY}"
            exit 1
          fi

          echo "Silvery Engine run completed successfully."

      - name: Dry run notice
        if: github.event.inputs.dry_run == 'true'
        run: echo "Dry run — no API call made."

      - name: Not configured notice
        if: steps.check_config.outputs.configured == 'false'
        run: |
          echo "Silvery Engine is not yet configured for automated runs."
          echo "To enable: add SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and SILVERY_ENGINE_USER_ID to repository secrets."
          echo "Manual runs are always available from the Silvery Engine tab in the dashboard."
